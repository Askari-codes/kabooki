services:
  postgres:
    image: postgres:16
    container_name: kabooki-postgres
    environment:
      POSTGRES_USER: maskari
      POSTGRES_PASSWORD: kabooki
      POSTGRES_DB: kabooki
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
